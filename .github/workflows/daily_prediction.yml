name: NSE Daily Stock Prediction

on:
  # Run at 9:30 AM IST (4:00 AM UTC) on weekdays
  schedule:
    - cron: "0 4 * * 1-5"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      top_n:
        description: "Number of top stocks to show"
        required: false
        default: "5"
      send_alert:
        description: "Send Telegram alert (true/false)"
        required: false
        default: "true"

jobs:
  predict:
    name: Run NSE Stock Prediction
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      - name: Run prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM: ${{ github.event.inputs.send_alert || 'true' }}
          TOP_N_STOCKS: ${{ github.event.inputs.top_n || '5' }}
        run: |
          python run_daily.py \
            --top ${{ github.event.inputs.top_n || '5' }}

      # -----------------------------------------------------------------------
      - name: Upload prediction log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-log-${{ github.run_id }}
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7
